<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#738694">
    <title>Dominika Słoma | RD Studio</title>
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../index_files/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../index_files/icon-192.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap">
    <style>

        :root {
            --color-pearl-white: #F4F2ED;
            --color-champagne-gold: #B89647;
            --color-brown-dark: #5A4D3B;

            /* Metaliczne, szczotkowane złoto – jak na stronie głównej */
            --metal-base: #9C855F;
            --metal-bg:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E"),
                linear-gradient(105deg,
                    #856F4D 0%,
                    #A38D68 25%,
                    #BBA682 45%,
                    #967F5A 65%,
                    #BFAB88 85%,
                    #7D6846 100%
                );
            --metal-shadow: 0 8px 25px rgba(156, 133, 95, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.6);

            /* Jasne, mleczne szkło */
            --glass-bg: rgba(244, 242, 237, 0.1);
            --glass-border: rgba(184, 150, 71, 0.3);
            --glass-blur: blur(25px);
            --glass-shadow: 0 15px 35px 0 rgba(141, 160, 169, 0.12), inset 0 1px 1px 0 rgba(255, 255, 255, 0.8);

            --panel-radius: 24px;
        }

        * { box-sizing: border-box; }

        html { background-color: var(--color-pearl-white); }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            font-family: 'Montserrat', sans-serif;
            color: var(--color-brown-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }

        /* --- TŁO --- */
        .fixed-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }
        .fixed-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .fixed-bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(244, 242, 237, 0.85), rgba(244, 242, 237, 0.2));
        }

        /* --- KARTA --- */
        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px 32px;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--panel-radius);
            box-shadow: var(--glass-shadow);
            animation: cardIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; }
        }

        /* --- LOGO --- */
        .logo-link {
            display: inline-flex;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .logo-link:hover { opacity: 0.8; transform: translateY(-2px); }
        .logo-wrapper {
            height: 110px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Logo jako maska SVG zabarwiona kolorem tła (działa też w Safari na iOS) */
        .logo-img {
            display: block;
            height: 110px;
            width: calc(110px * 2606 / 2314); /* proporcje viewBox logo-clean.svg */
            background-color: var(--color-brown-dark);
            -webkit-mask: url("../index_files/logo-clean.svg") center / contain no-repeat;
            mask: url("../index_files/logo-clean.svg") center / contain no-repeat;
        }

        /* --- NAGŁÓWEK --- */
        .name {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 2rem;
            line-height: 1.2;
            margin: 20px 0 8px;
        }
        .role {
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
        }
        .gold-line {
            width: 48px;
            height: 1px;
            background: var(--color-champagne-gold);
            border: 0;
            margin: 22px auto 10px;
        }

        /* --- KONTAKTY --- */
        .contacts {
            list-style: none;
            margin: 0 0 28px;
            padding: 0;
            text-align: left;
        }
        .contacts li + li { border-top: 1px solid var(--glass-border); }
        .contacts a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 4px;
            transition: transform 0.3s ease;
        }
        .contacts a:hover { transform: translateX(3px); }
        .contacts svg {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--color-champagne-gold);
            stroke-width: 1.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .contact-text { display: flex; flex-direction: column; min-width: 0; }
        .label {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.75;
        }
        .value {
            font-size: 15px;
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        /* --- PRZYCISKI --- */
        .btn {
            display: block;
            width: 100%;
            padding: 18px 20px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .btn + .btn { margin-top: 14px; }

        .btn-metal {
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background-color: var(--metal-base);
            background-image: var(--metal-bg);
            background-blend-mode: overlay, normal;
            box-shadow: var(--metal-shadow);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        /* Po najechaniu: metal zostaje, dochodzi miękka biała poświata */
        .btn-metal:hover {
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow:
                0 0 8px 2px rgba(255, 255, 255, 0.7),
                0 0 22px 8px rgba(255, 255, 255, 0.35),
                0 0 45px 16px rgba(255, 255, 255, 0.15),
                0 8px 25px rgba(156, 133, 95, 0.3),
                inset 0 1px 3px rgba(255, 255, 255, 0.9);
            filter: brightness(1.07);
            transform: translateY(-2px);
        }

        .btn-glass {
            color: var(--color-brown-dark);
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--color-champagne-gold);
        }
        .btn-glass:hover {
            color: #ffffff;
            background-color: var(--metal-base);
            background-image: var(--metal-bg);
            background-blend-mode: overlay, normal;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: var(--metal-shadow);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            transform: translateY(-1px);
        }

        .share-btn {
            margin-top: 18px;
            padding: 6px 10px;
            background: none;
            border: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--color-brown-dark);
            text-decoration: underline;
            text-decoration-color: var(--glass-border);
            text-underline-offset: 4px;
            cursor: pointer;
            transition: text-decoration-color 0.3s ease;
        }
        .share-btn:hover { text-decoration-color: var(--color-champagne-gold); }

        .motto {
            margin: 22px 0 0;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        @media (max-width: 480px) {
            .card { padding: 32px 22px 26px; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg" aria-hidden="true">
        <img src="../index_files/background.jpg" alt="" fetchpriority="high">
        <div class="fixed-bg-overlay"></div>
    </div>

    <main class="card">
        <a href="https://rdstudiodesign.com/" class="logo-link" aria-label="RD Studio – home page">
            <span class="logo-wrapper">
                <span class="logo-img" role="img" aria-label="RD Studio Logo"></span>
            </span>
        </a>

        <!-- DANE DO EDYCJI – zmień też w contact.vcf -->
        <h1 class="name">Dominika Sloma</h1>
        <p class="role">Founder &amp; Lead Designer</p>
        <hr class="gold-line">

        <ul class="contacts">
            <li>
                <a href="tel:+48668840966">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    <span class="contact-text"><span class="label">Phone</span><span class="value">+48 668 840 966</span></span>
                </a>
            </li>
            <li>
                <a href="mailto:contact@rdstudiodesign.com">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
                    <span class="contact-text"><span class="label">Email</span><span class="value">contact@rdstudiodesign.com</span></span>
                </a>
            </li>
            <li>
                <a href="https://rdstudiodesign.com">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5a14.5 14.5 0 0 1 0 19M12 2.5a14.5 14.5 0 0 0 0 19"/></svg>
                    <span class="contact-text"><span class="label">Website</span><span class="value">rdstudiodesign.com</span></span>
                </a>
            </li>
        </ul>
        <!-- /DANE DO EDYCJI -->

        <a href="contact.vcf" class="btn btn-metal" id="saveContact">Save Contact</a>
        <a href="https://rdstudiodesign.com" class="btn btn-glass">Visit Website</a>

        <button type="button" class="share-btn" id="shareBtn">Share this card</button>

        <p class="motto">Yacht &amp; Interior Design</p>
    </main>

    <script>
        /* Android: zamiast pobierać contact.vcf, otwórz systemowy formularz
           „Nowy kontakt” z wypełnionymi danymi. Jeśli telefon nie obsłuży tego
           intentu, Chrome przejdzie do browser_fallback_url (zwykły plik .vcf).
           DANE DO EDYCJI – muszą zgadzać się z HTML powyżej i z contact.vcf */
        (function () {
            if (!/Android/i.test(navigator.userAgent)) return;
            var e = encodeURIComponent;
            var contact = {
                name: 'Dominika Sloma',
                phone: '+48668840966',
                email: 'contact@rdstudiodesign.com',
                company: 'RD Studio',
                job_title: 'Founder & Lead Designer',
                notes: 'Yacht & Interior Design – https://rdstudiodesign.com'
            };
            var extras = Object.keys(contact).map(function (k) {
                return 'S.' + k + '=' + e(contact[k]);
            });
            extras.push('i.phone_type=2');  /* komórkowy */
            extras.push('i.email_type=2');  /* służbowy */
            extras.push('S.browser_fallback_url=' + e('https://rdstudiodesign.com/card/contact.vcf'));
            document.getElementById('saveContact').href =
                'intent:#Intent;action=android.intent.action.INSERT;' +
                'type=vnd.android.cursor.dir/raw_contact;' + extras.join(';') + ';end';
        })();

        (function () {
            var CARD_URL = 'https://rdstudiodesign.com/card/';
            var btn = document.getElementById('shareBtn');
            var label = btn.textContent;
            var timer;

            function showCopied() {
                btn.textContent = 'Link copied';
                clearTimeout(timer);
                timer = setTimeout(function () { btn.textContent = label; }, 2000);
            }

            function fallbackCopy() {
                var ta = document.createElement('textarea');
                ta.value = CARD_URL;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (e) {}
                document.body.removeChild(ta);
                showCopied();
            }

            function copyLink() {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(CARD_URL).then(showCopied, fallbackCopy);
                } else {
                    fallbackCopy();
                }
            }

            btn.addEventListener('click', function () {
                if (navigator.share) {
                    navigator.share({
                        title: 'Dominika Sloma | RD Studio',
                        text: 'Dominika Sloma – Founder & Lead Designer, RD Studio',
                        url: CARD_URL
                    }).catch(function (err) {
                        if (err && err.name !== 'AbortError') copyLink();
                    });
                } else {
                    copyLink();
                }
            });
        })();
    </script>
</body>
</html>
